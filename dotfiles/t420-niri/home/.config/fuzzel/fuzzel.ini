[main]
keyboard-focus=on-demand
font=JetBrainsMono Nerd Font:size=13
terminal=terminology -e
prompt="❯ "
icons-enabled=no
inner-pad=10
lines=12
width=44

[border]
width=2
radius=14

[colors]
background=1e1e2eee
text=cdd6f4ff
prompt=b4befeff
placeholder=6c7086ff
input=cdd6f4ff
match=f38ba8ff
selection=45475aff
selection-text=cdd6f4ff
selection-match=f38ba8ff
border=b4befeff

[key-bindings]
next-page=Control+Down Page_Down KP_Page_Down
prev-page=Control+Up Page_Up KP_Page_Up
first=Control+Home
last=Control+End
